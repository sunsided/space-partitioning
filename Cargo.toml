[package]
name = "space-partitioning"
description = "Space partitioning data structures"
version = "0.5.0"
edition = "2021"
keywords = ["space-partitioning", "trees"]
categories = ["computer-vision", "graphics", "game-development"]
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sunsided/space-partitioning"

[[example]]
name = "interval_tree"
path = "examples/interval_tree.rs"

[[example]]
name = "quadtree"
path = "examples/quadtree.rs"

[[example]]
name = "quadtree_noviz"
path = "examples/quadtree_noviz.rs"

[[bench]]
name = "bench_quadtree"
harness = false

[[bench]]
name = "bench_rtree"
harness = false

[[bench]]
name = "bench_compare_3d"
harness = false

[[bench]]
name = "bench_compare_2d"
harness = false

[dependencies]
smallvec = { version = "1.6.1", features = ["union", "const_generics"] }
num-traits = "0.2.14"
arrayvec = "0.7.2"

# Build all dependencies (but not this workspace) with optimizations enabled.
[profile.dev.package."*"]
opt-level = 1

[dev-dependencies]
rand = "0.8.4"
piston_window = "0.120.0"
criterion = "0.3.4"
indicatif = "0.16.2"
console = { version = "0.16.2", features = ["std"] }
